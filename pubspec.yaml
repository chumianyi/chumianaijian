publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.1
  file_picker: ^8.0.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  http: ^1.2.1
